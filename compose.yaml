name: aml-blockchain
x-app: &app
  image: aml-blockchain-backend:local
  build: ./backend
  init: true
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://aml_app:${APP_DB_PASSWORD:?Run node scripts/setup.mjs}@db:5432/aml
    SESSION_SECRET: ${SESSION_SECRET:?Run node scripts/setup.mjs}
    ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8080},http://127.0.0.1:${WEB_PORT:-8080},http://localhost:${API_PORT:-8000},http://localhost:5173,http://127.0.0.1:5173
  depends_on:
    migrate:
      condition: service_completed_successfully
  security_opt: [no-new-privileges:true]
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aml_owner
      POSTGRES_DB: aml
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup.mjs}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run node scripts/setup.mjs}
      EVALUATOR_DB_PASSWORD: ${EVALUATOR_DB_PASSWORD:?Run node scripts/setup.mjs}
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]
    volumes:
      - aml-data:/var/lib/postgresql/data
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U aml_owner -d aml"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    image: aml-blockchain-backend:local
    build: ./backend
    command: [python, -m, app.bootstrap]
    environment:
      DATABASE_URL: postgresql+psycopg://aml_owner:${POSTGRES_PASSWORD}@db:5432/aml
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run node scripts/setup.mjs}
      ANALYST_PASSWORD: ${ANALYST_PASSWORD:?Run node scripts/setup.mjs}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:?Run node scripts/setup.mjs}
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  api:
    <<: *app
    mem_limit: 512m
    cpus: 2
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000"]
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
  worker:
    <<: *app
    mem_limit: 2g
    cpus: 2
    command: [python, -m, app.worker]
    environment:
      <<: *app-env
      EVALUATOR_DATABASE_URL: postgresql+psycopg://aml_evaluator:${EVALUATOR_DB_PASSWORD}@db:5432/aml
    healthcheck:
      test: [CMD, python, -m, app.worker, --health]
      interval: 10s
      timeout: 3s
      retries: 6
  web:
    build: ./frontend
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/health]
      interval: 5s
      timeout: 3s
      retries: 12
  test:
    <<: *app
    profiles: [test]
    command: [pytest, -q]
    restart: "no"
    environment:
      <<: *app-env
      TEST_DATABASE_URL: postgresql+psycopg://aml_owner:${POSTGRES_PASSWORD}@db:5432/aml_test
volumes:
  aml-data:
